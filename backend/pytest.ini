[pytest]
testpaths = tests
pythonpath = .

# asyncio_mode=auto evita tener que decorar cada test asíncrono con
# @pytest.mark.asyncio: pytest-asyncio los detecta solo.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# La prueba de carga (5000 cartones, sorteo completo) tarda más que toda la
# suite junta, así que no corre por defecto. Para pedirla:
#   .venv\Scripts\python.exe -m pytest -m lento -s
markers =
    lento: prueba de carga; se pide a mano con -m lento

addopts = -v --tb=short -m "not lento"
